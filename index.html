<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Calorie Tracker</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calorie Tracker">
<meta name="theme-color" content="#101413">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container" id="app">
  <header>
    <div class="header-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2c1 3-3 4-3 8a3 3 0 0 0 6 0c1.2 1 2 2.8 2 4.5A5.5 5.5 0 0 1 6 14.5C6 9 12 7 12 2Z" fill="#101413"/></svg>
    </div>
    <div>
      <h1>Calorie Tracker</h1>
      <p class="subtitle" id="headerSubtitle">Daily food log</p>
    </div>
    <div class="header-spacer"></div>
    <button class="icon-btn" id="menuBtn" title="Backup & restore">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
    </button>
  </header>

  <div id="view-root"></div>
</div>

<nav class="tab-bar">
  <div class="tab-bar-inner">
    <button class="tab-btn active" data-action="switch-tab" data-tab="log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>
      Log
    </button>
    <button class="tab-btn" data-action="switch-tab" data-tab="meals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21 12 17 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"/></svg>
      My Meals
    </button>
    <button class="tab-btn" data-action="switch-tab" data-tab="summary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M8 17V10M13 17V6M18 17v-4"/></svg>
      Summary
    </button>
  </div>
</nav>

<div id="sheet-root"></div>
<div id="toast-root"></div>

<script src="vendor/html5-qrcode.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/foodApi.js"></script>
<script src="js/barcode.js"></script>
<script src="js/charts.js"></script>
<script src="js/backup.js"></script>
<script src="js/app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
